name: Daily risk monitor
on:
  schedule:
    - cron: "0 0 * * *" # 09:00 KST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect official data
        run: python -m collector.run
      - name: Test fail-safe classification
        run: python -m unittest discover -s tests -v
      - name: Commit live history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: daily risk snapshot"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
